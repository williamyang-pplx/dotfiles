<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Meeting Screen Blocker</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #0f172a;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 12px;
      }
      #status {
        font-size: 13px;
        color: #475569;
        margin-bottom: 12px;
      }
      button {
        width: 100%;
        padding: 10px;
        margin-bottom: 8px;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
      }
      #connectBtn {
        background: #2563eb;
        color: white;
      }
      #testBtn {
        background: #e2e8f0;
        color: #0f172a;
      }
      #meetings {
        margin-top: 12px;
        font-size: 12px;
        color: #334155;
      }
      #meetings div {
        padding: 6px 0;
        border-top: 1px solid #e2e8f0;
      }
    </style>
  </head>
  <body>
    <h1>Meeting Screen Blocker</h1>
    <div id="status">Checking status…</div>
    <button id="connectBtn">Connect Google Calendar</button>
    <button id="testBtn">Preview alert (test)</button>
    <div id="meetings"></div>
    <script src="popup.js"></script>
  </body>
</html>
